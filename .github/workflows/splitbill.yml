name: SplitBill build and test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SplitBill

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore SplitBill.sln

      - name: Build
        run: dotnet build SplitBill.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test SplitBill.sln --no-build --configuration Release --verbosity normal
